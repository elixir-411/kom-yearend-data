:root{
  --bg:#ffffff; --surface:#ffffff; --line:#e1e7f0; --line-soft:#eff3f8;
  --ink:#0b1630; --ink2:#47546b; --ink3:#8a96aa;
  --accent:#2f7bff; --accent-deep:#1f5fe0; --accent-soft:#e7f0ff;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:1180px;margin:0 auto;padding:32px 24px 60px}
.over{margin:0 0 4px;font-size:11px;letter-spacing:.28em;color:var(--ink3);font-weight:600}
h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:40px;line-height:1.1}
h1 em{color:var(--accent-deep);font-weight:500}
.sub{margin:8px 0 28px;color:var(--ink2);font-size:14px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:36px;align-items:start}
.panel{display:flex;flex-direction:column;gap:20px}
.f label,.f .lab{display:block;font-size:12px;color:var(--ink3);margin-bottom:6px}
input,select,button{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;height:38px;padding:0 10px}
input[type=text]{width:100%}
.row2{display:flex;gap:8px}
.row2 > *{flex:1;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;height:36px;color:var(--ink2);background:var(--surface)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:32px;font-size:13px;border-radius:999px;padding:0 12px;color:var(--ink2)}
.chips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{height:28px;font-size:12px;padding:0 10px;color:var(--ink2)}
.note{font-size:12px;color:var(--ink3);margin:6px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button.primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600;padding:0 18px}
button.primary:disabled{opacity:.35}
.preview{position:sticky;top:20px}
.preview canvas{width:100%;max-width:560px;height:auto;display:block;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 30px rgba(11,22,48,.08)}
.msg{font-size:13px;color:var(--ink2);margin-top:10px;min-height:20px}
@media (max-width:820px){
  .wrap{padding:22px 16px 40px}
  .grid{grid-template-columns:1fr;gap:24px}
  .preview{position:static;order:-1}
  h1{font-size:32px}
}
</style>
</head>
<body>
<div class="wrap">
  <p class="over">YEAR-END ARCHIVE · RANKING</p>
  <h1>karina <em>of</em> moment</h1>
  <p class="sub" id="sub">순위 이미지 만들기 · 이 화면은 찜 목록과 상관없이 따로 동작합니다</p>

  <div class="grid">
    <div class="panel">
      <div class="f"><span class="lab">기간</span>
        <div class="row2"><input type="date" id="from" aria-label="시작일"><input type="date" id="to" aria-label="종료일"></div>
        <div class="quick" id="quick"></div>
      </div>
      <div class="f"><span class="lab">담을 내용</span>
        <div class="seg" id="mode"><button data-v="one" class="on">한 부문</button><button data-v="multi">여러 부문</button></div>
      </div>
      <div class="f" id="oneBox"><span class="lab">부문</span>
        <div class="chips" id="metricOne"></div>
        <span class="lab" style="margin-top:14px">몇 위까지</span>
        <div class="seg" id="topn"><button data-v="3">TOP 3</button><button data-v="5" class="on">TOP 5</button><button data-v="10">TOP 10</button></div>
      </div>
      <div class="f" id="multiBox" hidden><span class="lab">부문 (최대 4개, 각 TOP 3)</span>
        <div class="chips" id="metricMulti"></div>
      </div>
      <div class="f"><span class="lab">종류</span>
        <div class="seg" id="kind"><button data-v="all" class="on">전체</button><button data-v="photo">사진</button><button data-v="video">영상</button></div>
      </div>
      <div class="f"><label for="title">제목 (비워 두면 자동)</label><input type="text" id="title" maxlength="40" placeholder=""></div>
      <div class="actions">
        <button class="primary" id="save">이미지 저장</button>
        <button id="share" hidden>공유하기</button>
      </div>
      <p class="note">1080 × 1350 PNG 로 저장됩니다. 반응 수는 자료를 모은 시점의 값입니다</p>
    </div>
    <div class="preview">
      <canvas id="cv" width="1080" height="1350" aria-label="순위 이미지 미리보기"></canvas>
      <p class="msg" id="msg"></p>
    </div>
  </div>
</div>

  var nf=new Intl.NumberFormat("ko-KR");
  var $=function(id){ return document.getElementById(id); };
  var st={mode:"one", metric:"likes", topn:5, multi:["likes","reposts","impressions","bookmarks"], kind:"all"};
  var imgCache={};

  function unent(s){ return String(s||"").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,"&"); }
  function cleanText(t){ return unent(t).replace(/https?:\/\/\S+/g,"").replace(/\s+/g," ").trim(); }
  function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null"); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }

  if(!D){ $("msg").textContent="자료(data.js)를 찾지 못했습니다"; return; }
  ALL=D.tweets.map(function(t){ t._day=dayFmt.format(new Date(t.created_at)); return t; });
  var days=ALL.map(function(t){return t._day;}).sort(), first=days[0], last=days[days.length-1];

  // ---------- 조작 화면
  function chips(el, multi){
    el.innerHTML=ORDER.map(function(k){ return '<button data-v="'+k+'">'+M[k]+'</button>'; }).join("");
  }
  chips($("metricOne")); chips($("metricMulti"));
  function seg(id, v){ Array.prototype.forEach.call($(id).children,function(b){ b.classList.toggle("on", b.dataset.v===String(v)); }); }
  function sync(){
    seg("mode", st.mode); seg("topn", st.topn); seg("kind", st.kind);
    Array.prototype.forEach.call($("metricOne").children,function(b){ b.classList.toggle("on", b.dataset.v===st.metric); });
    Array.prototype.forEach.call($("metricMulti").children,function(b){ b.classList.toggle("on", st.multi.indexOf(b.dataset.v)>=0); });
    $("oneBox").hidden = st.mode!=="one"; $("multiBox").hidden = st.mode!=="multi";
    $("title").placeholder = autoTitle();
  }
  // 기간 바로 고르기: 전체, 최근 달들
  function monthRange(ym){ var y=+ym.slice(0,4), m=+ym.slice(5,7); var end=new Date(Date.UTC(y,m,0)).toISOString().slice(0,10); return [ym+"-01", end]; }
  var months={}; days.forEach(function(d){ months[d.slice(0,7)]=1; });
  var ml=Object.keys(months).sort().reverse();
  $("quick").innerHTML='<button data-r="all">전체</button>'+ml.slice(0,6).map(function(k){ return '<button data-m="'+k+'">'+(+k.slice(5))+'월</button>'; }).join("")+
    (ml.length>6?'<select id="moreMonth" aria-label="다른 달"><option value="">다른 달</option>'+ml.slice(6).map(function(k){ return '<option value="'+k+'">'+k.slice(0,4)+'년 '+(+k.slice(5))+'월</option>'; }).join("")+'</select>':'');
  $("from").min=$("to").min=first; $("from").max=$("to").max=last;
  var saved=store("xyr-rank")||{};
  ["mode","metric","topn","multi","kind"].forEach(function(k){ if(saved[k]!==undefined) st[k]=saved[k]; });
  $("from").value = saved.from && saved.from>=first ? saved.from : (ml[0]? monthRange(ml[0])[0] : first);
  $("to").value = saved.to && saved.to<=last ? saved.to : last;
  if($("from").value<first) $("from").value=first;

  function setRange(a,b){ $("from").value=a<first?first:a; $("to").value=b>last?last:b; draw(); }
  $("quick").addEventListener("click", function(e){ var b=e.target.closest("button"); if(!b) return;
    if(b.dataset.r==="all") setRange(first,last); else { var r=monthRange(b.dataset.m); setRange(r[0],r[1]); } });
  $("quick").addEventListener("change", function(e){ if(e.target.id==="moreMonth" && e.target.value){ var r=monthRange(e.target.value); setRange(r[0],r[1]); } });
  ["from","to"].forEach(function(id){ $(id).addEventListener("change", function(){ if($("from").value>$("to").value){ var x=$("from").value; $("from").value=$("to").value; $("to").value=x; } draw(); }); });
  $("mode").addEventListener("click", function(e){ var b=e.target.closest("button"); if(b){ st.mode=b.dataset.v; draw(); } });
  $("topn").addEventListener("click", function(e){ var b=e.target.closest("button"); if(b){ st.topn=+b.dataset.v; draw(); } });
  $("kind").addEventListener("click", function(e){ var b=e.target.closest("button"); if(b){ st.kind=b.dataset.v; draw(); } });
  $("metricOne").addEventListener("click", function(e){ var b=e.target.closest("button"); if(b){ st.metric=b.dataset.v; draw(); } });
  $("metricMulti").addEventListener("click", function(e){ var b=e.target.closest("button"); if(!b) return;
    var k=b.dataset.v, i=st.multi.indexOf(k);
    if(i>=0){ if(st.multi.length>1) st.multi.splice(i,1); }
    else { if(st.multi.length>=4){ $("msg").textContent="여러 부문은 4개까지 고를 수 있습니다"; return; } st.multi.push(k); st.multi.sort(function(a,b){ return ORDER.indexOf(a)-ORDER.indexOf(b); }); }
    draw(); });
  $("title").addEventListener("input", function(){ clearTimeout(window._tt); window._tt=setTimeout(draw,250); });

  // ---------- 자료 고르기
  function hasKind(t){ if(st.kind==="all") return true; return (t.media||[]).some(function(m){ return st.kind==="photo"? m.type==="photo" : m.type!=="photo"; }); }
  function pool(){ var a=$("from").value, b=$("to").value; return ALL.filter(function(t){ return t._day>=a && t._day<=b && hasKind(t); }); }
  function top(list, k, n){ return list.slice().sort(function(x,y){ return (y[k]||0)-(x[k]||0); }).slice(0,n); }
  function rangeLabel(){
    var a=$("from").value, b=$("to").value;
    if(a===first && b===last) return "전체 기간";
    var ma=a.slice(0,7), mr=monthRange(ma);
    if(a===mr[0] && (b===mr[1] || (b===last && b.slice(0,7)===ma))) return a.slice(0,4)+"년 "+(+a.slice(5,7))+"월";
    return a.replace(/-/g,".")+" – "+b.slice(a.slice(0,4)===b.slice(0,4)?5:0).replace(/-/g,".");
  }
  function autoTitle(){
    var r=rangeLabel();
    if(st.mode==="one") return r+" "+M[st.metric]+" TOP "+st.topn;
    return r+" 부문별 TOP 3";
  }

  // ---------- 그리기 도구
  function loadImg(url){
    if(!url) return Promise.resolve(null);
    if(imgCache[url]) return imgCache[url];
    imgCache[url]=new Promise(function(res){
      var im=new Image(); im.crossOrigin="anonymous"; im.referrerPolicy="no-referrer";
      im.onload=function(){ res(im); }; im.onerror=function(){ res(null); };
      im.src=url;
    });
    return imgCache[url];
  }
  function thumbUrl(t){ var m=(t.media||[])[0]; if(!m) return ""; var u=m.thumb||""; return u.indexOf("?")<0 && m.type==="photo" ? u+"?name=small" : u; }
  function isVideo(t){ var m=(t.media||[])[0]; return m && m.type!=="photo"; }
  function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function cover(ctx, im, x,y,w,h, r){
    ctx.save(); rr(ctx,x,y,w,h,r||0); ctx.clip();
    ctx.fillStyle=C.soft; ctx.fillRect(x,y,w,h);
    if(im){ var s=Math.max(w/im.width, h/im.height), iw=im.width*s, ih=im.height*s; ctx.drawImage(im, x+(w-iw)/2, y+(h-ih)/2, iw, ih); }
    ctx.restore();
  }
  function badge(ctx, text, x, y){
    ctx.font="600 20px "+SANS; var w=ctx.measureText(text).width+20;
    ctx.fillStyle="rgba(11,22,48,.78)"; rr(ctx,x,y,w,32,6); ctx.fill();
    ctx.fillStyle="#fff"; ctx.textBaseline="middle"; ctx.fillText(text,x+10,y+16.5); ctx.textBaseline="alphabetic";
  }
  function wrap(ctx, text, maxW, maxLines){
    var out=[], line="";
    for(var i=0;i<text.length;i++){
      var ch=text[i], test=line+ch;
      if(ctx.measureText(test).width>maxW && line){ out.push(line); line=ch===" "?"":ch; if(out.length===maxLines) break; }
      else line=test;
    }
    if(out.length<maxLines && line) out.push(line);
    else if(out.length===maxLines && (line || out.join("").length<text.length)){
      var l=out[maxLines-1]; while(l && ctx.measureText(l+"…").width>maxW) l=l.slice(0,-1); out[maxLines-1]=l.replace(/\s+$/,"")+"…";
    }
    return out;
  }
  function md(d){ return (+d.slice(5,7))+"."+(+d.slice(8,10)); }

  // 반응 아이콘 (선)
  var ICON={
    likes:"M12 20s-7.2-4.5-9.3-8.7C1.2 8.2 3 4.8 6.5 4.8c2.1 0 3.4 1.2 4.2 2.4.6.8 1.9.8 2.5 0 .8-1.2 2.1-2.4 4.2-2.4 3.5 0 5.3 3.4 3.8 6.5C19.2 15.5 12 20 12 20z",
    reposts:"M4 9.5 7 6.5l3 3M7 7v8.5a2 2 0 0 0 2 2h5M20 14.5l-3 3-3-3M17 17V8.5a2 2 0 0 0-2-2h-5",
    replies:"M12 4.5c4.7 0 8.5 3 8.5 6.8s-3.8 6.8-8.5 6.8c-1 0-2-.1-2.9-.4L5 19.5l1.2-3.6c-1.7-1.2-2.7-2.9-2.7-4.6 0-3.8 3.8-6.8 8.5-6.8z",
    bookmarks:"M7 4.5h10a1 1 0 0 1 1 1v14l-6-4-6 4v-14a1 1 0 0 1 1-1z",
    impressions:"M5 19.5v-6M10 19.5v-12M15 19.5v-8M20 19.5v-14",
    quotes:"M5 11h4.5v4.5c0 2-1.2 3.2-3.5 3.8M14.5 11H19v4.5c0 2-1.2 3.2-3.5 3.8M5 11c0-3 1.3-5 4-5.8M14.5 11c0-3 1.3-5 4-5.8"
  };
  function icon(ctx, k, x, y, size, color, fill){
    var p=new Path2D(ICON[k]); ctx.save(); ctx.translate(x,y); ctx.scale(size/24,size/24);
    ctx.lineWidth=2; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle=color;
    if(fill && k==="likes"){ ctx.fillStyle=color; ctx.fill(p); } ctx.stroke(p); ctx.restore();
  }

  // ---------- 이미지
  var drawSeq=0;
  function header(ctx, title){
    ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
    // 위쪽 파란 선
    var g=ctx.createLinearGradient(0,0,W,0); g.addColorStop(0,C.accent); g.addColorStop(1,"#7fb3ff");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,10);
    ctx.fillStyle=C.ink3; ctx.font="600 20px "+SANS; ctx.letterSpacing="6px";
    ctx.fillText("KARINA OF MOMENT · YEAR-END ARCHIVE", 72, 92); ctx.letterSpacing="0px";
    ctx.fillStyle=C.ink; ctx.font="800 58px "+SANS;
    var tl=wrap(ctx, title, W-144, 2); tl.forEach(function(l,i){ ctx.fillText(l, 72, 168+i*70); });
    var y=168+(tl.length-1)*70+44;
    ctx.fillStyle=C.ink2; ctx.font="400 24px "+SANS;
    var sub=$("from").value.replace(/-/g,".")+" – "+$("to").value.replace(/-/g,".")+" · "+(st.kind==="all"?"사진·영상":st.kind==="photo"?"사진":"영상")+" 트윗 "+nf.format(pool().length)+"개 중";
    ctx.fillText(sub, 72, y);
    return y+36;
  }
  function footer(ctx){
    ctx.fillStyle=C.line; ctx.fillRect(72, H-86, W-144, 1.5);
    ctx.fillStyle=C.ink3; ctx.font="400 20px "+SANS;
    var ca=D.collected_at? new Date(D.collected_at) : null;
    ctx.fillText("@"+(D.account||"")+(ca?"  ·  반응 수는 "+dayFmt.format(ca).replace(/-/g,".")+" 수집 기준":""), 72, H-46);
    ctx.textAlign="right"; ctx.font="italic 600 30px "+SERIF; ctx.fillStyle=C.deep;
    ctx.fillText("karina of moment", W-72, H-42); ctx.textAlign="left";
  }
  function metricText(ctx, k, v, x, y, size, color){
    icon(ctx, k, x, y-size*0.82, size, color, true);
    ctx.fillStyle=color; ctx.font="700 "+size+"px "+SANS; ctx.fillText(nf.format(v||0), x+size+8, y);
  }

  function drawOne(ctx, list, imgs, y0){
    var k=st.metric, n=list.length;
    if(!n){ ctx.fillStyle=C.ink3; ctx.font="400 30px "+SANS; ctx.fillText("이 기간에 해당하는 트윗이 없습니다", 72, y0+80); return; }
    if(st.topn===10){
      // 2열 × 5줄
      var colW=(W-144-32)/2, rowH=(H-86-30-y0)/5, th=rowH-24;
      list.forEach(function(t,i){
        var col=Math.floor(i/5), row=i%5, x=72+col*(colW+32), y=y0+row*rowH;
        ctx.fillStyle=i<3?C.deep:C.ink3; ctx.font="800 34px "+SANS; ctx.fillText(String(i+1), x, y+40);
        var tx=x+50; cover(ctx, imgs[i], tx, y, th, th, 10); if(isVideo(t)) badge(ctx,"영상",tx+8,y+th-40);
        var bx=tx+th+18, bw=colW-(bx-x);
        metricText(ctx, k, t[k], bx, y+36, 30, C.deep);
        ctx.fillStyle=C.ink3; ctx.font="400 20px "+SANS; ctx.fillText(md(t._day), bx, y+70);
        ctx.fillStyle=C.ink2; ctx.font="400 21px "+SANS; wrap(ctx, cleanText(t.text), bw, 2).forEach(function(l,j){ ctx.fillText(l, bx, y+102+j*28); });
      });
      return;
    }
    // 1위 크게 + 나머지 줄
    var avail=H-86-30-y0, heroH=st.topn===3? Math.round(avail*0.54) : Math.round(avail*0.40);
    var t=list[0], hx=72, hw=W-144, imgW=Math.round(heroH*0.9);
    cover(ctx, imgs[0], hx, y0, imgW, heroH, 16); if(isVideo(t)) badge(ctx,"영상",hx+14,y0+heroH-48);
    ctx.fillStyle=C.accent; rr(ctx, hx+14, y0+14, 74, 74, 37); ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="800 40px "+SANS; ctx.textAlign="center"; ctx.fillText("1", hx+51, y0+65); ctx.textAlign="left";
    var bx=hx+imgW+36, bw=hw-imgW-36;
    ctx.fillStyle=C.ink3; ctx.font="600 22px "+SANS; ctx.fillText(M[k]+" 1위 · "+md(t._day), bx, y0+44);
    metricText(ctx, k, t[k], bx, y0+118, 64, C.deep);
    ctx.fillStyle=C.ink; ctx.font="400 28px "+SANS; wrap(ctx, cleanText(t.text), bw, 4).forEach(function(l,j){ ctx.fillText(l, bx, y0+184+j*40); });
    var rest=list.slice(1), ry=y0+heroH+34, rh=(H-86-24-ry)/Math.max(rest.length,1), th2=Math.min(rh-18, 190);
    var big=th2>150, mSize=big?34:28, lines=Math.max(1, Math.floor((th2-(big?96:84))/(big?33:28))+1);
    rest.forEach(function(t,i){
      var y=ry+i*rh;
      ctx.fillStyle=C.line; ctx.fillRect(72, y-14, W-144, 1);
      ctx.fillStyle=i<2?C.deep:C.ink3; ctx.font="800 40px "+SANS; ctx.fillText(String(i+2), 72, y+th2/2+14);
      var tx=132; cover(ctx, imgs[i+1], tx, y, th2, th2, 12); if(isVideo(t)) badge(ctx,"영상",tx+8,y+th2-40);
      var bx2=tx+th2+28, bw2=W-72-bx2;
      metricText(ctx, k, t[k], bx2, y+mSize+4, mSize, C.deep);
      ctx.fillStyle=C.ink3; ctx.font="400 20px "+SANS; ctx.fillText(md(t._day), bx2, y+mSize+36);
      ctx.fillStyle=C.ink2; ctx.font="400 "+(big?24:22)+"px "+SANS; wrap(ctx, cleanText(t.text), bw2, lines).forEach(function(l,j){ ctx.fillText(l, bx2, y+mSize+(big?74:66)+j*(big?33:28)); });
    });
  }

  function drawMulti(ctx, groups, imgs, y0){
    var n=groups.length, avail=H-86-30-y0, sh=avail/n, gap=20, tw=(W-144-gap*2)/3, th=Math.min(tw, sh-112);
    groups.forEach(function(g,gi){
      var y=y0+gi*sh;
      icon(ctx, g.k, 72, y+6, 30, C.deep, true);
      ctx.fillStyle=C.ink; ctx.font="800 30px "+SANS; ctx.fillText(M[g.k]+" TOP 3", 112, y+30);
      g.list.forEach(function(t,i){
        var x=72+i*(tw+gap), iy=y+50;
        cover(ctx, imgs[gi][i], x, iy, tw, th, 12); if(isVideo(t)) badge(ctx,"영상",x+8,iy+th-40);
        ctx.fillStyle=i===0?C.accent:"rgba(11,22,48,.78)"; rr(ctx, x+10, iy+10, 44, 44, 22); ctx.fill();
        ctx.fillStyle="#fff"; ctx.font="800 24px "+SANS; ctx.textAlign="center"; ctx.fillText(String(i+1), x+32, iy+40); ctx.textAlign="left";
        ctx.fillStyle=C.deep; ctx.font="700 26px "+SANS; ctx.fillText(nf.format(t[g.k]||0), x, iy+th+34);
        ctx.fillStyle=C.ink3; ctx.font="400 20px "+SANS; ctx.textAlign="right"; ctx.fillText(md(t._day), x+tw, iy+th+34); ctx.textAlign="left";
      });
      if(!g.list.length){ ctx.fillStyle=C.ink3; ctx.font="400 24px "+SANS; ctx.fillText("해당 트윗 없음", 72, y+90); }
    });
  }

  function draw(){
    sync();
    store("xyr-rank",{mode:st.mode, metric:st.metric, topn:st.topn, multi:st.multi, kind:st.kind, from:$("from").value, to:$("to").value});
    var my=++drawSeq, P=pool(), title=$("title").value.trim()||autoTitle();
    var job;
    if(st.mode==="one"){
      var list=top(P, st.metric, st.topn);
      job=Promise.all(list.map(function(t){ return loadImg(thumbUrl(t)); })).then(function(imgs){ return function(ctx,y){ drawOne(ctx, list, imgs, y); }; });
    } else {
      var groups=st.multi.map(function(k){ return {k:k, list:top(P,k,3)}; });
      job=Promise.all(groups.map(function(g){ return Promise.all(g.list.map(function(t){ return loadImg(thumbUrl(t)); })); })).then(function(imgs){ return function(ctx,y){ drawMulti(ctx, groups, imgs, y); }; });
    }
    $("msg").textContent="사진을 불러오는 중입니다";
    Promise.all([job, document.fonts? document.fonts.load('italic 600 30px "Cormorant Garamond"').catch(function(){}) : null]).then(function(r){
      if(my!==drawSeq) return;
      var ctx=$("cv").getContext("2d");
      var y=header(ctx, title); r[0](ctx, y+40); footer(ctx);
      $("msg").textContent="";
    });
  }

  function fileName(){ return (($("title").value.trim()||autoTitle()).replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g,"_"))+".png"; }
  function toBlob(){ return new Promise(function(res){ $("cv").toBlob(function(b){ res(b); }, "image/png"); }); }
  $("save").addEventListener("click", function(){
    toBlob().then(function(b){
      if(!b){ $("msg").textContent="이미지를 만들지 못했습니다. 사진을 불러오지 못한 것 같습니다"; return; }
      var a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=fileName(); document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },800);
      $("msg").textContent="저장했습니다 ("+fileName()+")";
    });
  });
  // 폰: 공유 시트로 바로 보내기 (지원하는 브라우저만)
  if(navigator.canShare && window.File){
    try{ if(navigator.canShare({files:[new File([""],"a.png",{type:"image/png"})]})) $("share").hidden=false; }catch(e){}
  }
  $("share").addEventListener("click", function(){
    toBlob().then(function(b){ if(!b) return; var f=new File([b], fileName(), {type:"image/png"});
      navigator.share({files:[f], title:$("title").value.trim()||autoTitle()}).catch(function(){}); });
  });
  sync(); draw();
})();
</script>
</body>
